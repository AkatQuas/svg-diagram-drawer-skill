<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660">
  <style>
    text { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="20" y="30" fill="#0f172a" font-size="16" font-weight="700">Web Application Architecture</text>
  <text x="20" y="46" fill="#64748b" font-size="9">TTB Layered Architecture · Light Theme</text>

  <!-- ============ ROW1: Client Layer (y=70) ============ -->
  <!-- Web Browser -->
  <rect x="150" y="70" width="180" height="55" rx="6" fill="#f8fafc"/>
  <rect x="150" y="70" width="180" height="55" rx="6" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="240" y="97" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Web Browser</text>
  <text x="240" y="112" fill="#64748b" font-size="9" text-anchor="middle">React / Vue SPA</text>

  <!-- Mobile App -->
  <rect x="410" y="70" width="180" height="55" rx="6" fill="#f8fafc"/>
  <rect x="410" y="70" width="180" height="55" rx="6" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="500" y="97" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Mobile App</text>
  <text x="500" y="112" fill="#64748b" font-size="9" text-anchor="middle">iOS / Android</text>

  <!-- Arrow: Client to CDN -->
  <line x1="240" y1="125" x2="240" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="125" x2="500" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW2: CDN (y=165) ============ -->
  <rect x="210" y="165" width="320" height="55" rx="6" fill="#f8fafc"/>
  <rect x="210" y="165" width="320" height="55" rx="6" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1.5"/>
  <text x="370" y="192" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">CloudFront CDN + WAF</text>
  <text x="370" y="207" fill="#64748b" font-size="9" text-anchor="middle">Edge Caching · DDoS Protection · SSL Termination</text>

  <!-- Arrow: CDN to Gateway -->
  <line x1="370" y1="220" x2="370" y2="305" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ AWS Region Boundary ============ -->
  <rect x="40" y="250" width="720" height="370" rx="12" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="52" y="268" fill="#d97706" font-size="9" font-weight="600">AWS us-east-1</text>

  <!-- VPC Boundary -->
  <rect x="55" y="280" width="690" height="325" rx="8" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="65" y="296" fill="#d97706" font-size="8" font-weight="500">VPC 10.0.0.0/16</text>

  <!-- ============ ROW3: Gateway (y=310) ============ -->
  <rect x="210" y="310" width="320" height="55" rx="6" fill="#f8fafc"/>
  <rect x="210" y="310" width="320" height="55" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="370" y="337" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">ALB / API Gateway</text>
  <text x="370" y="352" fill="#64748b" font-size="9" text-anchor="middle">Load Balancing · Rate Limiting · Auth</text>

  <!-- Arrow: Gateway to Services (L-shaped) -->
  <path d="M 370 365 L 370 385 L 150 385 L 150 400" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="365" x2="370" y2="400" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 370 365 L 370 385 L 510 385 L 510 400" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW4: Services (y=405) ============ -->
  <!-- Auth Service -->
  <rect x="75" y="405" width="150" height="55" rx="6" fill="#f8fafc"/>
  <rect x="75" y="405" width="150" height="55" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="150" y="432" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Auth Service</text>
  <text x="150" y="447" fill="#64748b" font-size="9" text-anchor="middle">JWT · OAuth2.0 · SSO</text>

  <!-- User Service -->
  <rect x="255" y="405" width="150" height="55" rx="6" fill="#f8fafc"/>
  <rect x="255" y="405" width="150" height="55" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="432" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">User Service</text>
  <text x="330" y="447" fill="#64748b" font-size="9" text-anchor="middle">Profile · Preferences · Roles</text>

  <!-- Order Service -->
  <rect x="435" y="405" width="150" height="55" rx="6" fill="#f8fafc"/>
  <rect x="435" y="405" width="150" height="55" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="510" y="432" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Order Service</text>
  <text x="510" y="447" fill="#64748b" font-size="9" text-anchor="middle">Cart · Checkout · Payments</text>

  <!-- ============ Message Bus ============ -->
  <rect x="75" y="490" width="510" height="18" rx="3" fill="rgba(234,88,12,0.12)" stroke="#ea580c" stroke-width="1"/>
  <text x="330" y="503" fill="#ea580c" font-size="8" font-weight="600" text-anchor="middle">Event Bus — SQS / SNS</text>

  <!-- Arrows: Services to Bus -->
  <line x1="150" y1="460" x2="150" y2="486" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="330" y1="460" x2="330" y2="486" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="510" y1="460" x2="510" y2="486" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Arrows: Bus to Data Stores -->
  <line x1="150" y1="512" x2="150" y2="530" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="512" x2="330" y2="530" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="512" x2="510" y2="530" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW5: Data Layer (y=535) ============ -->
  <!-- PostgreSQL -->
  <g transform="translate(75, 535)">
    <rect x="0" y="10" width="150" height="60" rx="2" fill="#f8fafc"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="#f8fafc"/>
    <ellipse cx="75" cy="70" rx="75" ry="12" fill="#f8fafc"/>
    <rect x="0" y="10" width="150" height="60" fill="rgba(124,58,237,0.12)"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="75" cy="70" rx="75" ry="12" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="150" y1="10" x2="150" y2="70" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="75" y="45" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="75" y="60" fill="#64748b" font-size="8" text-anchor="middle">Primary Database</text>
  </g>

  <!-- Redis -->
  <g transform="translate(255, 535)">
    <rect x="0" y="10" width="150" height="60" rx="2" fill="#f8fafc"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="#f8fafc"/>
    <ellipse cx="75" cy="70" rx="75" ry="12" fill="#f8fafc"/>
    <rect x="0" y="10" width="150" height="60" fill="rgba(124,58,237,0.12)"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="75" cy="70" rx="75" ry="12" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="150" y1="10" x2="150" y2="70" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="75" y="45" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Redis Cache</text>
    <text x="75" y="60" fill="#64748b" font-size="8" text-anchor="middle">Session · Cache Queue</text>
  </g>

  <!-- S3 -->
  <g transform="translate(435, 535)">
    <rect x="0" y="10" width="150" height="60" rx="2" fill="#f8fafc"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="#f8fafc"/>
    <ellipse cx="75" cy="70" rx="75" ry="12" fill="#f8fafc"/>
    <rect x="0" y="10" width="150" height="60" fill="rgba(124,58,237,0.12)"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
    <ellipse cx="75" cy="70" rx="75" ry="12" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="150" y1="10" x2="150" y2="70" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="75" y="45" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">S3 Storage</text>
    <text x="75" y="60" fill="#64748b" font-size="8" text-anchor="middle">Assets · Backups</text>
  </g>

  <!-- ============ Legend ============ -->
  <rect x="580" y="605" width="190" height="40" rx="4" fill="rgba(100,116,139,0.08)" stroke="#94a3b8" stroke-width="0.5"/>
  <text x="590" y="618" fill="#64748b" font-size="7" font-weight="600">Legend</text>
  <rect x="590" y="624" width="8" height="8" rx="2" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1"/>
  <text x="602" y="632" fill="#64748b" font-size="7">Client</text>
  <rect x="640" y="624" width="8" height="8" rx="2" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1"/>
  <text x="652" y="632" fill="#64748b" font-size="7">Service</text>
  <rect x="700" y="624" width="8" height="8" rx="2" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1"/>
  <text x="712" y="632" fill="#64748b" font-size="7">Data</text>
</svg>