<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610">
  <style>
    text { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="white" font-size="16" font-weight="700">User Registration Flow</text>
  <text x="20" y="46" fill="#94a3b8" font-size="9">Top-to-Bottom Flowchart - Happy Path Down Center</text>

  <rect x="210" y="50" width="180" height="45" rx="22" fill="#0f172a"/>
  <rect x="210" y="50" width="180" height="45" rx="22" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="2"/>
  <text x="300" y="77" fill="white" font-size="11" font-weight="600" text-anchor="middle">Start</text>
  <line x1="300" y1="95" x2="300" y2="125" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="130" width="180" height="50" rx="6" fill="#0f172a"/>
  <rect x="210" y="130" width="180" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="300" y="157" fill="white" font-size="11" font-weight="600" text-anchor="middle">Fill Registration Form</text>
  <text x="300" y="172" fill="#94a3b8" font-size="8" text-anchor="middle">Email - Password - Name</text>
  <line x1="300" y1="180" x2="300" y2="215" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g transform="translate(300, 245)">
    <polygon points="0,-35 55,0 0,35 -55,0" fill="#0f172a"/>
    <polygon points="0,-35 55,0 0,35 -55,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" fill="white" font-size="10" font-weight="600" text-anchor="middle">Valid</text>
    <text y="16" fill="#94a3b8" font-size="8" text-anchor="middle">Input?</text>
  </g>

  <line x1="300" y1="280" x2="300" y2="325" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="300" fill="#34d399" font-size="9" font-weight="600">Yes</text>

  <rect x="210" y="330" width="180" height="50" rx="6" fill="#0f172a"/>
  <rect x="210" y="330" width="180" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="300" y="357" fill="white" font-size="11" font-weight="600" text-anchor="middle">Create Account</text>
  <text x="300" y="372" fill="#94a3b8" font-size="8" text-anchor="middle">Hash Password - Insert DB</text>
  <line x1="300" y1="380" x2="300" y2="415" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="420" width="180" height="50" rx="6" fill="#0f172a"/>
  <rect x="210" y="420" width="180" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="300" y="447" fill="white" font-size="11" font-weight="600" text-anchor="middle">Send Welcome Email</text>
  <text x="300" y="462" fill="#94a3b8" font-size="8" text-anchor="middle">Verification Link</text>
  <line x1="300" y1="470" x2="300" y2="505" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="510" width="180" height="45" rx="22" fill="#0f172a"/>
  <rect x="210" y="510" width="180" height="45" rx="22" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="2"/>
  <text x="300" y="537" fill="white" font-size="11" font-weight="600" text-anchor="middle">End</text>

  <line x1="355" y1="245" x2="490" y2="245" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="410" y="238" fill="#fb7185" font-size="9" font-weight="600">No</text>

  <rect x="480" y="220" width="200" height="50" rx="6" fill="#0f172a"/>
  <rect x="480" y="220" width="200" height="50" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="580" y="247" fill="white" font-size="11" font-weight="600" text-anchor="middle">Show Error Message</text>
  <text x="580" y="262" fill="#94a3b8" font-size="8" text-anchor="middle">Invalid input, please retry</text>

  <path d="M 580 270 L 580 340 L 150 340 L 150 155" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-rose)"/>
  <text x="578" y="310" fill="#fb7185" font-size="8" font-style="italic">retry</text>

  <rect x="20" y="560" width="300" height="35" rx="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="0.5"/>
  <text x="30" y="574" fill="#94a3b8" font-size="7" font-weight="600">Legend</text>
  <rect x="30" y="580" width="8" height="8" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="42" y="588" fill="#94a3b8" font-size="7">Start/End</text>
  <rect x="100" y="580" width="8" height="8" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="112" y="588" fill="#94a3b8" font-size="7">Process</text>
  <rect x="160" y="580" width="8" height="8" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="172" y="588" fill="#94a3b8" font-size="7">Decision</text>
  <rect x="225" y="580" width="8" height="8" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="237" y="588" fill="#94a3b8" font-size="7">Error</text>
</svg>