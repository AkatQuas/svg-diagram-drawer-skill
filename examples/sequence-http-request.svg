<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600">
  <style>
    text { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="20" y="30" fill="white" font-size="16" font-weight="700">HTTP Request Processing Sequence</text>
  <text x="20" y="46" fill="#94a3b8" font-size="9">Browser - CDN - Gateway - Auth - Service - Database</text>

  <!-- Browser -->
  <rect x="55" y="60" width="130" height="40" rx="6" fill="#0f172a"/>
  <rect x="55" y="60" width="130" height="40" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="120" y="85" fill="white" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
  <!-- CDN -->
  <rect x="245" y="60" width="130" height="40" rx="6" fill="#0f172a"/>
  <rect x="245" y="60" width="130" height="40" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="310" y="85" fill="white" font-size="11" font-weight="600" text-anchor="middle">CDN / WAF</text>
  <!-- API Gateway -->
  <rect x="435" y="60" width="130" height="40" rx="6" fill="#0f172a"/>
  <rect x="435" y="60" width="130" height="40" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="85" fill="white" font-size="11" font-weight="600" text-anchor="middle">API Gateway</text>
  <!-- Auth Service -->
  <rect x="625" y="60" width="130" height="40" rx="6" fill="#0f172a"/>
  <rect x="625" y="60" width="130" height="40" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="690" y="85" fill="white" font-size="11" font-weight="600" text-anchor="middle">Auth Service</text>
  <!-- Business Service -->
  <rect x="815" y="60" width="130" height="40" rx="6" fill="#0f172a"/>
  <rect x="815" y="60" width="130" height="40" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="880" y="85" fill="white" font-size="11" font-weight="600" text-anchor="middle">Business Svc</text>
  <!-- Database -->
  <rect x="935" y="60" width="130" height="40" rx="6" fill="#0f172a"/>
  <rect x="935" y="60" width="130" height="40" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1000" y="85" fill="white" font-size="11" font-weight="600" text-anchor="middle">Database</text>

  <line x1="120" y1="100" x2="120" y2="540" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="310" y1="100" x2="310" y2="540" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="500" y1="100" x2="500" y2="540" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="690" y1="100" x2="690" y2="540" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="880" y1="100" x2="880" y2="540" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="1000" y1="100" x2="1000" y2="540" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <line x1="120" y1="120" x2="305" y2="120" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="215" y="112" fill="#e2e8f0" font-size="9" text-anchor="middle">GET /api/orders</text>

  <path d="M 310,160 L 350,160 L 350,185 L 310,185" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="170" fill="#e2e8f0" font-size="8">Cache Lookup</text>
  <rect x="305" y="120" width="10" height="50" rx="2" fill="rgba(120,53,15,0.4)" stroke="#fbbf24" stroke-width="0.5"/>

  <line x1="310" y1="210" x2="495" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="202" fill="#e2e8f0" font-size="9" text-anchor="middle">Forward Request</text>
  <rect x="495" y="210" width="10" height="90" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="0.5"/>

  <rect x="400" y="245" width="470" height="70" rx="4" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="400" y="245" width="40" height="18" rx="4" fill="rgba(30,41,59,0.8)" stroke="#64748b" stroke-width="1"/>
  <text x="420" y="258" fill="#94a3b8" font-size="8" font-weight="600" text-anchor="middle">alt</text>
  <text x="450" y="258" fill="#94a3b8" font-size="8" font-style="italic">[JWT valid]</text>

  <line x1="500" y1="270" x2="685" y2="270" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="262" fill="#e2e8f0" font-size="9" text-anchor="middle">validateJWT(token)</text>
  <rect x="685" y="270" width="10" height="25" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="0.5"/>

  <line x1="690" y1="300" x2="505" y2="300" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="595" y="292" fill="#94a3b8" font-size="8" text-anchor="middle" font-style="italic">{userId: 123}</text>

  <line x1="400" y1="320" x2="870" y2="320" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="410" y="333" fill="#94a3b8" font-size="8" font-style="italic">[else]</text>
  <line x1="500" y1="345" x2="120" y2="345" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="310" y="337" fill="#fb7185" font-size="8" text-anchor="middle" font-style="italic">HTTP 401 Unauthorized</text>

  <line x1="500" y1="380" x2="875" y2="380" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="372" fill="#e2e8f0" font-size="9" text-anchor="middle">getOrders(userId)</text>
  <rect x="875" y="380" width="10" height="80" rx="2" fill="rgba(30,41,59,0.4)" stroke="#94a3b8" stroke-width="0.5"/>

  <line x1="880" y1="420" x2="995" y2="420" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="940" y="412" fill="#e2e8f0" font-size="8" text-anchor="middle" font-style="italic">SELECT * FROM orders</text>
  <text x="943" y="425" fill="#e2e8f0" font-size="8" text-anchor="middle" font-style="italic">WHERE user_id=?</text>
  <rect x="995" y="420" width="10" height="25" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="0.5"/>

  <line x1="1000" y1="450" x2="885" y2="450" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="940" y="442" fill="#94a3b8" font-size="8" text-anchor="middle" font-style="italic">[orders data]</text>

  <line x1="880" y1="490" x2="505" y2="490" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="690" y="482" fill="#94a3b8" font-size="8" text-anchor="middle" font-style="italic">{orders: [...]}</text>

  <line x1="500" y1="530" x2="125" y2="530" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="310" y="522" fill="#34d399" font-size="9" text-anchor="middle" font-style="italic">HTTP 200 OK - JSON Response</text>

  <rect x="20" y="555" width="520" height="35" rx="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="0.5"/>
  <text x="30" y="569" fill="#94a3b8" font-size="7" font-weight="600">Legend</text>
  <line x1="30" y1="580" x2="50" y2="580" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="54" y="583" fill="#94a3b8" font-size="7">Sync call</text>
  <line x1="115" y1="580" x2="135" y2="580" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="139" y="583" fill="#94a3b8" font-size="7">Return</text>
  <rect x="210" y="576" width="8" height="8" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="0.5"/>
  <text x="222" y="583" fill="#94a3b8" font-size="7">Activation bar</text>
  <rect x="310" y="576" width="8" height="8" rx="2" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="322" y="583" fill="#94a3b8" font-size="7">alt/loop frame</text>
</svg>